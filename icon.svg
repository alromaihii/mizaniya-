<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#1c7d3c"/>

  <!-- Wallet body -->
  <rect x="96" y="168" width="320" height="210" rx="28" fill="white" opacity="0.95"/>

  <!-- Wallet flap (top fold) -->
  <rect x="96" y="148" width="320" height="60" rx="20" fill="white" opacity="0.7"/>
  <rect x="96" y="168" width="320" height="20" fill="white" opacity="0.7"/>

  <!-- Coin pocket -->
  <rect x="296" y="218" width="100" height="80" rx="18" fill="#1c7d3c" opacity="0.18"/>
  <circle cx="346" cy="258" r="22" fill="#1c7d3c" opacity="0.35"/>
  <line x1="346" y1="244" x2="346" y2="272" stroke="#1c7d3c" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="332" y1="258" x2="360" y2="258" stroke="#1c7d3c" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Card lines -->
  <rect x="116" y="230" width="140" height="14" rx="7" fill="#1c7d3c" opacity="0.18"/>
  <rect x="116" y="258" width="100" height="10" rx="5" fill="#1c7d3c" opacity="0.12"/>
</svg>
